<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" role="img" aria-label="同一个下午的两种工作方式，IM 聊天动画" font-family="Noto Sans SC,PingFang SC,Microsoft YaHei,sans-serif"><defs><marker id="m-sys" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e3a4b"/></marker><marker id="m-tool" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6db5"/></marker><marker id="m-mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b5cc4"/></marker><marker id="m-skill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#149488"/></marker><marker id="m-inst" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d7f93"/></marker><marker id="m-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d48a14"/></marker><marker id="m-know" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3e9a4e"/></marker><marker id="m-res" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2793b"/></marker><marker id="m-inp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d1456c"/></marker><marker id="m-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f5f8b"/></marker><marker id="m-def" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7d8a99"/></marker></defs><rect x="14" y="12" width="456" height="462" rx="8" fill="#eef1f5" fill-opacity=".6"/><text x="28" y="34" font-size="13" fill="#d1456c" text-anchor="start" font-weight="700">今天：你在三个会话里被来回拉扯</text><rect x="30" y="44" width="134" height="26" rx="13.0" fill="#e9ecef"/><text x="97.0" y="61.14" font-size="11.5" fill="#16202c" text-anchor="middle">修 Bug</text><rect x="172" y="44" width="134" height="26" rx="13.0" fill="#e9ecef"/><text x="239.0" y="61.14" font-size="11.5" fill="#16202c" text-anchor="middle">写方案</text><rect x="314" y="44" width="134" height="26" rx="13.0" fill="#e9ecef"/><text x="381.0" y="61.14" font-size="11.5" fill="#16202c" text-anchor="middle">跑数据</text><path d="M30 76L454 76" fill="none" stroke="#7d8a99" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.0269;0.0385;0.9846;1" values="0;0;1;1;0"/><rect x="30" y="84" width="24" height="24" rx="7" fill="#2f6db5"/><text x="42" y="101" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">A</text><rect x="62" y="84" width="180" height="32" rx="12" fill="#fff" stroke="#d5dbe3"/><text x="74" y="105" font-size="12.5" fill="#16202c" text-anchor="start">用方案 A 还是 B？</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.0885;0.1000;0.9846;1" values="0;0;1;1;0"/><rect x="364" y="122" width="90" height="32" rx="12" fill="#2f6db5"/><text x="376" y="143" font-size="12.5" fill="#fff" text-anchor="start">B 吧</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.1500;0.1615;0.9846;1" values="0;0;1;1;0"/><rect x="30" y="160" width="24" height="24" rx="7" fill="#e2793b"/><text x="42" y="177" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">C</text><rect x="62" y="160" width="190" height="32" rx="12" fill="#f9e3e9" stroke="#d5dbe3"/><text x="74" y="181" font-size="12.5" fill="#a02a4c" text-anchor="start">报错了，怎么办？</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.2192;0.2308;0.9846;1" values="0;0;1;1;0"/><rect x="30" y="198" width="24" height="24" rx="7" fill="#d48a14"/><text x="42" y="215" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">事</text><rect x="62" y="198" width="220" height="32" rx="12" fill="#f9eedb" stroke="#d5dbe3"/><text x="74" y="219" font-size="12.5" fill="#16202c" text-anchor="start">群里 @你：需求改了</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.2962;0.3077;0.9846;1" values="0;0;1;1;0"/><rect x="314" y="236" width="140" height="32" rx="12" fill="#2f6db5"/><text x="326" y="257" font-size="12.5" fill="#fff" text-anchor="start">转述一遍…</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.3731;0.3846;0.9846;1" values="0;0;1;1;0"/><rect x="30" y="274" width="24" height="24" rx="7" fill="#7b5cc4"/><text x="42" y="291" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">B</text><rect x="62" y="274" width="190" height="32" rx="12" fill="#fff" stroke="#d5dbe3"/><text x="74" y="295" font-size="12.5" fill="#16202c" text-anchor="start">继续问你：然后呢？</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.4346;0.4462;0.9846;1" values="0;0;1;1;0"/><rect x="30" y="312" width="24" height="24" rx="7" fill="#e2793b"/><text x="42" y="329" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">C</text><rect x="62" y="312" width="130" height="32" rx="12" fill="#f9e3e9" stroke="#d5dbe3"/><text x="74" y="333" font-size="12.5" fill="#a02a4c" text-anchor="start">还在等你</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.1500;0.1615;0.9846;1" values="0;0;1;1;0"/><circle cx="434" cy="48" r="8" fill="#d1456c"/><text x="434" y="52" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">1</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.3731;0.3846;0.9846;1" values="0;0;1;1;0"/><circle cx="292" cy="48" r="8" fill="#d1456c"/><text x="292" y="52" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">1</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.4346;0.4462;0.9846;1" values="0;0;1;1;0"/><circle cx="434" cy="48" r="8" fill="#d1456c"/><text x="434" y="52" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="700">2</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.5115;0.5231;0.9846;1" values="0;0;1;1;0"/><rect x="204" y="350" width="250" height="32" rx="12" fill="#2f6db5"/><text x="216" y="371" font-size="12.5" fill="#fff" text-anchor="start">方案 B 是在哪个窗口定的来着？</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.5885;0.6000;0.9846;1" values="0;0;1;1;0"/><text x="242" y="402" font-size="12" fill="#a02a4c" text-anchor="middle">（切回跑数据窗口，发现它已经等了一小时）</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.6808;0.6923;0.9846;1" values="0;0;1;1;0"/><text x="242" y="432" font-size="14" fill="#d1456c" text-anchor="middle" font-weight="700">三件事，全靠你一个人记、一个人传话</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.7192;0.7308;0.9846;1" values="0;0;1;1;0"/><text x="242" y="456" font-size="13" fill="#5e6a79" text-anchor="middle">并行的上限，就是你的注意力</text></g><rect x="490" y="12" width="456" height="462" rx="8" fill="#eef1f5" fill-opacity=".6"/><text x="504" y="34" font-size="13" fill="#149488" text-anchor="start" font-weight="700">Super-agent：你只和一个 Agent 说话</text><rect x="506" y="44" width="134" height="26" rx="13.0" fill="#dcf0ee"/><text x="573.0" y="61.14" font-size="11.5" fill="#16202c" text-anchor="middle">Super-agent</text><path d="M506 76L930 76" fill="none" stroke="#7d8a99" stroke-width="1"/><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.0500;0.0615;0.9846;1" values="0;0;1;1;0"/><rect x="680" y="84" width="250" height="32" rx="12" fill="#2f6db5"/><text x="692" y="105" font-size="12.5" fill="#fff" text-anchor="start">修 Bug、写方案、跑数据，都交给你</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.1192;0.1308;0.9846;1" values="0;0;1;1;0"/><rect x="506" y="128" width="24" height="24" rx="7" fill="#149488"/><text x="518" y="145" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">S</text><rect x="538" y="128" width="200" height="32" rx="12" fill="#fff" stroke="#d5dbe3"/><text x="550" y="149" font-size="12.5" fill="#16202c" text-anchor="start">好，都开工了，有事找你</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.2192;0.2308;0.9846;1" values="0;0;1;1;0"/><rect x="506" y="172" width="24" height="24" rx="7" fill="#d48a14"/><text x="518" y="189" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">事</text><rect x="538" y="172" width="230" height="32" rx="12" fill="#f9eedb" stroke="#d5dbe3"/><text x="550" y="193" font-size="12.5" fill="#16202c" text-anchor="start">群里同事说：需求改了</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.4115;0.4231;0.9846;1" values="0;0;1;1;0"/><rect x="506" y="260" width="24" height="24" rx="7" fill="#149488"/><text x="518" y="277" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">S</text><rect x="538" y="260" width="260" height="32" rx="12" fill="#fff" stroke="#d5dbe3"/><text x="550" y="281" font-size="12.5" fill="#16202c" text-anchor="start">方案要二选一，你定一下：A 还是 B？</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.4885;0.5000;0.9846;1" values="0;0;1;1;0"/><rect x="880" y="304" width="50" height="32" rx="12" fill="#2f6db5"/><text x="892" y="325" font-size="12.5" fill="#fff" text-anchor="start">B</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.5808;0.5923;0.9846;1" values="0;0;1;1;0"/><rect x="506" y="348" width="24" height="24" rx="7" fill="#149488"/><text x="518" y="365" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">S</text><rect x="538" y="348" width="240" height="32" rx="12" fill="#fff" stroke="#d5dbe3"/><text x="550" y="369" font-size="12.5" fill="#16202c" text-anchor="start">Bug 修好了，PR 在这，你看一眼</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.2962;0.3077;0.9846;1" values="0;0;1;1;0"/><text x="718.0" y="234" font-size="11.5" fill="#5e6a79" text-anchor="middle">（它自己把这条消息交给了写方案的那个分身）</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.6577;0.6692;0.9846;1" values="0;0;1;1;0"/><rect x="506" y="392" width="24" height="24" rx="7" fill="#149488"/><text x="518" y="409" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="700">S</text><rect x="538" y="392" width="200" height="32" rx="12" fill="#fff" stroke="#d5dbe3"/><text x="550" y="413" font-size="12.5" fill="#16202c" text-anchor="start">数据跑完了，结论在这</text></g><g opacity="0"><animate attributeName="opacity" dur="26s" repeatCount="indefinite" keyTimes="0;0.7346;0.7462;0.9846;1" values="0;0;1;1;0"/><text x="718" y="452" font-size="13.5" fill="#149488" text-anchor="middle" font-weight="700">同样三件事，你只说了两句话</text></g></svg>