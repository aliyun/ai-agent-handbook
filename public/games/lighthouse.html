<!doctype html>
<html lang="zh-CN">
<head>
<script>if(window.parent===window)location.replace("audit-sea.html?level=0");</script>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>迷雾灯塔 · 深海版小样 v7（音乐）</title>
<style>
:root{color-scheme:dark;--ink:#e2f3f6;--muted:#93b7c4;--line:#2f5d75;--gold:#e7c47a;--u:1;--ix:12vw;--iy:42vh}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#040e17;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #ffd88a;outline-offset:3px}button:disabled{cursor:wait;opacity:.55}[hidden]{display:none!important}
.game-shell{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0e2c43,#040e17 78%);user-select:none;-webkit-user-select:none}
/* 游戏层：缩放锚点是地图上灯塔岛的位置 */
.world{position:absolute;inset:0;z-index:1;transform-origin:var(--ix) var(--iy);transition:transform 1.3s cubic-bezier(.3,0,.15,1),opacity .9s ease}
.stage{position:absolute;left:0;top:0;width:100vw;height:56.25vw;overflow:hidden;background:#0f3048;box-shadow:0 0 90px #000c}
canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
.frame{position:absolute;left:var(--vl,0);top:var(--vt,0);right:var(--vr,0);bottom:var(--vb,0);pointer-events:none;transition:opacity .5s ease .95s}
.hud{position:absolute;left:calc(30px*var(--u));right:calc(30px*var(--u));top:calc(24px*var(--u));display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.level-title{display:flex;align-items:baseline;gap:calc(12px*var(--u));text-shadow:0 2px 16px #021422,0 0 3px #021422}
.level-title h1{margin:0;font-size:calc(27px*var(--u));font-weight:750;letter-spacing:1px;color:#f0fafb;white-space:nowrap}
.level-title span{font-size:calc(13px*var(--u));letter-spacing:2px;color:#c3e2e8;white-space:nowrap}
.hud-right{display:flex;align-items:center;gap:calc(8px*var(--u))}.stats{display:flex;gap:calc(8px*var(--u))}
.stat,.map-btn{height:calc(36px*var(--u));border-radius:30px;border:1px solid #4f8aa3b0;background:#0a2236c9;color:#e6f6f8;display:flex;align-items:center;gap:7px;font-size:calc(13px*var(--u));box-shadow:0 4px 16px #0005}
.stat{padding:0 calc(13px*var(--u));font-variant-numeric:tabular-nums}
.pearl-dot{width:10px;height:10px;border-radius:50%;background:#fff8e8;box-shadow:0 0 0 2px #d9b46a,0 0 8px #ffe3a0aa}
.shell-dot{width:18px;height:18px;object-fit:contain;filter:drop-shadow(0 0 4px #ffd98a88)}
.map-btn{pointer-events:auto;padding:0 calc(7px*var(--u)) 0 calc(14px*var(--u));text-decoration:none;border-color:#6fc6d1b0}
.map-btn:hover{background:#15465f;border-color:#9be3ea}
.map-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
kbd{font:inherit;font-size:10px;line-height:1;padding:4px 6px;border-radius:6px;border:1px solid #5f97aa;border-bottom-width:2px;background:#123a52;color:#d5edf1}
.toast{position:absolute;top:calc(86px*var(--u));left:50%;transform:translateX(-50%);font-size:14px;line-height:1.5;font-weight:600;padding:9px 18px;background:#0e2c42e6;border:1px solid #6fc6d1;border-radius:30px;color:#e8f8fa;box-shadow:0 4px 20px #0006;max-width:90%;text-align:center;opacity:0;transition:opacity .15s}
.toast.show{opacity:1}
.progress{position:absolute;left:calc(30px*var(--u));right:calc(30px*var(--u));bottom:10px;height:3px;background:#9fe7ff26;border-radius:3px}
.progress i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,#6fe0e8,#f2cf7c);border-radius:3px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#03111d55}
.card{width:min(360px,100%);text-align:center;background:#0f2f47f0;border:1px solid #5fb3c4;border-radius:26px;padding:26px 30px;box-shadow:0 18px 80px #000a;color:#e6f6f8}
.card h2{font-size:30px;line-height:1.3;margin:10px 0 12px}.card p{font-size:14px;line-height:1.8;color:#a9c9d3;margin:8px 0}
.loopie-mark{width:90px;height:70px;object-fit:contain;margin-bottom:4px}
.primary{border:0;background:linear-gradient(#ecc982,#c08a3e);color:#1d2a33;padding:12px 30px;border-radius:30px;font-size:15px;font-weight:650;min-width:176px;box-shadow:0 5px 16px #0006;margin-top:14px}
.primary:hover{background:linear-gradient(#f3d495,#cf9a4c)}.loading-error{color:#ffb4a8!important}
/* 底部操作栏：画面内浮层 */
.controls{position:absolute;left:50%;bottom:calc(24px*var(--u));transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:10px 12px;border-radius:22px;background:#071a29e6;border:1px solid #2f5d75;box-shadow:0 12px 40px #000a;pointer-events:auto;width:max-content;max-width:calc(100% - 24px);transition:opacity .6s ease,transform .6s ease}
.pad,.actions,.utilities{display:flex;gap:8px;align-items:center;transition:opacity .4s}
.control{touch-action:none;border:1px solid #3f7590;border-bottom-width:3px;background:#173d57;color:#e3f3f6;border-radius:13px;min-width:52px;height:48px;padding:0 14px;font-size:18px;display:flex;gap:7px;align-items:center;justify-content:center}
.control span{font-size:11px}.control.active,.control:active{background:#25587a;transform:translateY(1px);border-bottom-width:1px}
.control.jump{background:linear-gradient(#e7c47a,#c08a3e);color:#1d2a33;border-color:#8a6127;min-width:100px}.control.jump.active{background:#f0d08e}
.control.run{background:#24506a;border-color:#4f8aa3;color:#ffe7b0;font-size:13px}
.utility{height:34px;border:1px solid #3f7590;border-radius:20px;background:transparent;color:#cfe6ec;padding:0 12px;font-size:11px;white-space:nowrap}.utility:hover{background:#173d57}
.control-hint{display:flex;align-items:center;gap:12px;color:#a9cfd8;font-size:11px;line-height:1.7}.control-hint p{margin:0;white-space:nowrap}
.keys{display:grid;grid-template-columns:repeat(3,24px);grid-auto-rows:22px;gap:3px}
.keys kbd{display:grid;place-items:center;padding:0;font-size:12px}.keys .k-up{grid-column:2}.keys kbd:not(.k-up){grid-row:2}
.hinting .keys kbd{border-color:#e7c47a;color:#fff3cf;animation:keyglow 1.3s ease-in-out infinite}
.hinting .keys kbd:nth-child(2){animation-delay:.12s}.hinting .keys kbd:nth-child(3){animation-delay:.24s}.hinting .keys kbd:nth-child(4){animation-delay:.36s}
@keyframes keyglow{0%,100%{box-shadow:0 0 0 #e7c47a00;background:#123a52}50%{box-shadow:0 0 12px #e7c47acc;background:#4a4a36}}
.dock-hidden .controls{opacity:0;transform:translate(-50%,18px);pointer-events:none}
/* 触屏：方向和跳跃常驻，其余随操作栏隐藏 */
.touch .control-hint{display:none}
.touch .controls{left:calc(14px*var(--u));right:calc(14px*var(--u));width:auto;max-width:none;transform:none;justify-content:space-between}
.touch.dock-hidden .controls{opacity:1;transform:none;background:transparent;border-color:transparent;box-shadow:none;pointer-events:none}
.touch.dock-hidden .utilities{opacity:0;visibility:hidden}.touch.dock-hidden .pad,.touch.dock-hidden .actions{pointer-events:auto;opacity:.9}
/* 竖屏手机：画面居上，操作栏放到画面下方的空白处 */
.portrait .controls{position:fixed;left:12px;right:12px;bottom:max(18px,env(safe-area-inset-bottom));width:auto;transform:none;flex-wrap:wrap;justify-content:space-between}
.portrait .utilities{order:3;width:100%;justify-content:center}.portrait.dock-hidden .controls{transform:none}
/* 群岛地图层 */
.map-layer{position:absolute;inset:0;z-index:5;width:100%;height:100%;border:0;background:#0b2236;visibility:hidden;opacity:0;pointer-events:none;transform:scale(2.6);transform-origin:var(--ix) var(--iy);transition:transform 1.5s cubic-bezier(.45,0,.2,1),opacity 1.1s ease .1s}
.map-prep .map-layer{visibility:visible}
.map-open .world{transform:scale(.06);opacity:0;transition:transform 1.3s cubic-bezier(.6,0,.35,1),opacity .8s ease .45s}
.map-open .frame{opacity:0;transition:opacity .25s}
.map-open .map-layer{opacity:1;transform:scale(1);transition:transform 1.5s cubic-bezier(.25,.7,.2,1),opacity .9s ease .2s}
.map-settled .world{visibility:hidden}
.map-settled .map-layer{pointer-events:auto}
@media(max-width:1120px){.control-hint p{display:none}.controls{gap:12px}}
@media(max-width:760px){.control{min-width:44px;height:44px;padding:0 10px}.control.jump{min-width:80px}.utility{padding:0 9px;height:30px;font-size:10px}.pad,.actions,.utilities{gap:6px}.card{padding:16px 22px}.card h2{font-size:23px;margin:6px 0}.loopie-mark{width:60px;height:46px}.primary{font-size:13px;padding:9px 24px;min-width:140px}.toast{font-size:11px;padding:6px 12px}kbd{font-size:9px;padding:3px 5px}}
@media(prefers-reduced-motion:reduce){.world,.map-open .world,.map-layer,.map-open .map-layer{transform:none!important;transition:opacity .2s!important}.frame,.map-open .frame{transition:opacity .2s!important}.hinting .keys kbd{animation:none}.controls{transition:opacity .2s!important}}
</style>
</head>
<body>
<section class="game-shell dock-hidden" id="shell" aria-label="Loopie 横版闯关游戏">
<div class="world" id="world">
<div class="stage" id="stage"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="操控 Loopie 穿过海岛平台。左右移动，空格或上方向键跳跃，下方向键蹲下，Shift 奔跑。"></canvas>
<div class="overlay" id="overlay"><div class="card" role="dialog" aria-modal="true" aria-labelledby="overlayTitle"><img class="loopie-mark" id="mark" alt="官方 Loopie"><h2 id="overlayTitle">迷雾灯塔</h2><p id="overlayText" hidden></p><button class="primary" id="start" disabled>加载中…</button></div></div>
</div>
<div class="frame" id="frame">
<header class="hud"><div class="level-title"><h1>迷雾灯塔</h1><span>第一关</span></div><div class="hud-right"><div class="stats"><span class="stat" aria-label="珍珠数量"><i class="pearl-dot"></i><b id="pearls">0</b></span><span class="stat" id="shellStat" aria-label="贝壳数量" hidden><img class="shell-dot" id="shellIcon" alt=""><b id="shells">0</b></span></div><a class="map-btn" id="mapBtn" href="audit-sea.html?level=0" aria-keyshortcuts="Escape"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z M9 3v16 M15 5v16"/></svg>群岛地图<kbd>Esc</kbd></a></div></header>
<div class="toast" id="toast" role="status" aria-live="polite"></div><div class="progress" aria-hidden="true"><i id="progress"></i></div>
<div class="controls" id="controls"><div class="pad" aria-label="方向控制"><button class="control" data-action="left" aria-label="向左移动">←</button><button class="control" data-action="down" aria-label="蹲下">↓</button><button class="control" data-action="right" aria-label="向右移动">→</button></div><div class="control-hint" id="hint"><div class="keys" aria-hidden="true"><kbd class="k-up">↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></div><p>← → / A D 移动　↓ / S 蹲下<br>空格 / ↑ / W 跳跃　Shift / X 奔跑</p></div><div class="utilities"><button class="utility" id="pause">暂停</button><button class="utility" id="restart">重来</button><button class="utility" id="sound" aria-pressed="true">声音：开</button><button class="utility" id="expand" aria-pressed="false">全屏</button></div><div class="actions"><button class="control jump" data-action="jump" aria-label="跳跃，按得更久跳得更高">↑ <span>跳跃</span></button></div></div>
</div>
</div>
<iframe class="map-layer" id="mapLayer" title="群岛地图" tabindex="-1" aria-hidden="true"></iframe>
</section>
<script defer src="assets/20d2429f6649f6879df6fade.js"></script></body></html>
